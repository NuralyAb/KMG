<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 548" width="480" height="548" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="548.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Что происходит</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Диаметр</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Межзерновой коллектор</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Корка и зона</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">проникновения</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">d_c &lt; d_a</text><line x1="20.0" y1="178.0" x2="460.0" y2="178.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="208.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Плотная сцементированная порода</text><text x="30.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Диаметр не</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">меняется</text><text x="258.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">d_c = d_a</text><line x1="20.0" y1="280.0" x2="460.0" y2="280.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="310.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Глины, сланцы, аргиллиты</text><text x="30.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Разбухание и</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">вымывание струёй</text><text x="258.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">d_c &gt; d_a</text><line x1="20.0" y1="382.0" x2="460.0" y2="382.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="412.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Трещины, карст, соли</text><text x="30.0" y="440.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Диаметр может</text><text x="30.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">увеличиваться</text><text x="258.0" y="440.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">d_c &gt; d_a</text><rect x="20.0" y="492.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="517.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>