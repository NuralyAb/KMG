<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 762" width="480" height="762" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="762.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Метод</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Что ещё</text><text x="258.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">показывает</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Пористость</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ЯМР, СП, ГМ</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ЯМР и в</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">карбонатах; СП,</text><text x="258.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ГМ — терригенный</text><line x1="20.0" y1="234.0" x2="460.0" y2="234.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="264.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Глинистость</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ГГМ, НМ, АК</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">особенно при</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">совместном</text><text x="258.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">использовании</text><line x1="20.0" y1="364.0" x2="460.0" y2="364.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="394.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Коллектор</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Почти все методы</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористости,</text><text x="30.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинистости</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">косвенные</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сведения</text><line x1="20.0" y1="494.0" x2="460.0" y2="494.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="524.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Продуктивность</text><text x="30.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Микрозонды</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при неглубоком</text><text x="258.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">проникновении</text><line x1="20.0" y1="596.0" x2="460.0" y2="596.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="626.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Газонасыщенность</text><text x="30.0" y="654.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ГГМ, НМ</text><text x="258.0" y="654.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при неглубоком</text><text x="258.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">проникновении</text><rect x="20.0" y="706.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="731.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>