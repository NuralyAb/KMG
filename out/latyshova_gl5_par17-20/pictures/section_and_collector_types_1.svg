<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 502" width="480" height="502" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="502.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Терригенный</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Карбонатный</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Преобладающие коллекторы</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">межзерновые</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">межзерновые,</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">кавернозно-трещ-</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">инные, смешанные</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Деление межзерновых</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">по пористости и</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">по глинистости</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">только по</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористости</text><line x1="20.0" y1="308.0" x2="460.0" y2="308.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="338.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Вторичные поры</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">не названы</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">выщелачивание,</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">перекристаллиза-</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ция</text><rect x="20.0" y="446.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="471.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>