[project]
name = "glava"
version = "0.1.0"
description = "Глава книги -> учебный слой -> проверенный демо-курс"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pymupdf>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6"]

[project.scripts]
glava = "glava.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/glava"]

[tool.pytest.ini_options]
testpaths = ["tests"]
