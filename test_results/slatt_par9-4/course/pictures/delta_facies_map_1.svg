<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 576" width="480" height="576" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="576.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Рукава и бары</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Между песками</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что сюда входит</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">распределительн-</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ые рукава,</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">устьевые бары</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">междурукавные</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">заливы, марши,</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">лагуны</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Роль в пласте</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">песчаные</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">коллекторы</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинистые</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">барьеры</text><line x1="20.0" y1="308.0" x2="460.0" y2="308.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="338.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Положение песков</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сами песчаные</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">фации</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">разделяют</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">песчаные фации</text><line x1="20.0" y1="410.0" x2="460.0" y2="410.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="440.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Нефтематеринские породы</text><text x="30.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">—</text><text x="258.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">иногда служат</text><text x="258.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ими</text><rect x="20.0" y="520.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="545.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>