<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 604" width="480" height="604" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="604.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">По литофациям</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">По времени</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что сопоставляют</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">интервалы со</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сходным откликом</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">каротажа</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">то, что отвечает</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">геологическому</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">времени</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Форма тел на разрезе</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">субгоризонтальн-</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ые песчаные тела</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">тела наклонены в</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сторону бассейна</text><line x1="20.0" y1="308.0" x2="460.0" y2="308.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="338.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Песчаники между скважинами</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непрерывны</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">разделены</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">гетеролитами и</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинами</text><line x1="20.0" y1="438.0" x2="460.0" y2="438.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="468.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Сообщаются ли скв. 1 и 2</text><text x="30.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">кажутся</text><text x="30.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непрерывными</text><text x="258.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">не сообщаются</text><rect x="20.0" y="548.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="573.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>