<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 806" width="480" height="806" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="806.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Область сноса: источник осадка</text><rect x="20.0" y="130.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="164.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Речные русла, разделённые</text><text x="240.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">глинистыми поймами</text><rect x="20.0" y="268.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="302.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Вниз по течению русла</text><text x="240.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">разветвляются</text><rect x="20.0" y="406.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="440.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Дельтовая равнина и устьевые бары</text><rect x="20.0" y="516.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="550.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Дальше к морю: фронт дельты и</text><text x="240.0" y="578.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">продельта</text><rect x="20.0" y="654.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="688.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Из них в основном сложена нижняя</text><text x="240.0" y="716.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">зона Ромео</text><line x1="240.0" y1="74.0" x2="240.0" y2="114.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,127.0 L231.0,114.4 L249.0,114.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="212.0" x2="240.0" y2="252.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,265.0 L231.0,252.4 L249.0,252.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="350.0" x2="240.0" y2="390.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,403.0 L231.0,390.4 L249.0,390.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="460.0" x2="240.0" y2="500.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,513.0 L231.0,500.4 L249.0,500.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="226.0" y="494.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">к морю</text><line x1="240.0" y1="598.0" x2="240.0" y2="638.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,651.0 L231.0,638.4 L249.0,638.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="750.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="775.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>