<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 504" width="480" height="504" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="504.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="126.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Рукава</text><text x="126.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">многократно</text><text x="126.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">раздваиваются у</text><text x="126.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">устьев</text><rect x="248.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Дельта долго</text><text x="354.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">наращивается в</text><text x="354.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">сторону</text><text x="354.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">бассейна</text><rect x="20.0" y="214.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Широкий покров вдоль простирания</text><text x="240.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">из многих устьевых баров</text><rect x="20.0" y="352.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Но внутри бара фации и</text><text x="240.0" y="414.0" fill="#ECEFF4" font-size="22" font-