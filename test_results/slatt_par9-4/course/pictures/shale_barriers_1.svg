<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 558" width="480" height="558" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="558.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Выдержанные</text><text x="30.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">глины</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Прерванные глины</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Протяжённость</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">некоторые шире</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">шага между</text><text x="30.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">скважинами</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">другие менее</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непрерывны</text><line x1="20.0" y1="234.0" x2="460.0" y2="234.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="264.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Особенность</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">барьер по</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">вертикали,</text><text x="30.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">направляют</text><text x="30.0" y="376.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">заводнение</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">причины: эрозия</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сверху или</text><text x="258.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">выклинивание</text><line x1="20.0" y1="392.0" x2="460.0" y2="392.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="422.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Три пласта на востоке</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">местами все три</text><text x="30.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">разделяют слои</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">местами все три</text><text x="258.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">отсутствуют</text><rect x="20.0" y="502.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="527.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>