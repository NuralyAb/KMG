<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 698" width="480" height="698" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="698.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Swa (Арчи) и Swr (отношения)</text><text x="240.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">незатронутой зоны</text><rect x="20.0" y="158.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="126.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Профиль</text><text x="126.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">ступенчатый;</text><text x="126.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Sw, Rt, Rxo, di</text><text x="126.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">верны</text><rect x="248.0" y="158.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#2980B9" stroke-width="2"/><text x="354.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Оценки</text><text x="354.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">расходятся:</text><text x="354.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">какая больше?</text><rect x="20.0" y="352.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="126.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Rxo/Rt мало;</text><text x="126.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">возможен</text><text x="126.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">переходный</text><text x="126.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">профиль, Swa</text><text x="126.0" y="498.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">хороша</text><rect x="248.0" y="352.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Rxo/Rt велико;</text><text x="354.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">возможен</text><text x="354.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">кольцевой</text><text x="354.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">профиль</text><rect x="20.0" y="574.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="608.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">(Sw)COR = Swa × (Swa/Swr)^0,25</text><line x1="126.0" y1="102.0" x2="126.0" y2="142.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,155.0 L117.0,142.4 L135.0,142.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="140.0" y="136.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Swa≈Swr</text><line x1="354.0" y1="102.0" x2="354.0" y2="142.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,155.0 L345.0,142.4 L363.0,142.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="340.0" y="136.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">иначе</text><line x1="354.0" y1="296.0" x2="138.3" y2="346.1" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,349.0 L136.2,337.4 L140.3,354.9 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="140.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Swa&gt;Swr</text><line x1="354.0" y1="296.0" x2="354.0" y2="336.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,349.0 L345.0,336.4 L363.0,336.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="340.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">Swa&lt;Swr</text><line x1="354.0" y1="518.0" x2="354.0" y2="558.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,571.0 L345.0,558.4 L363.0,558.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="340.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">поправка</text><rect x="20.0" y="642.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="667.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>