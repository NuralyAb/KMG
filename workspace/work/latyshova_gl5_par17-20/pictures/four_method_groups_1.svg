<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 632" width="480" height="632" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="632.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Методы</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Применимость</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Выделение коллекторов</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">микрозонды,</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">каверномер, ЯМ</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">фильтрующие</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">интервалы с</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">коркой</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Пористость</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ГГМ,</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">акустический,</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">нейтронные</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">любой раствор и</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">вода</text><line x1="20.0" y1="336.0" x2="460.0" y2="336.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="366.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Глинистость: СП</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">метод</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">собственных</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">потенциалов</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинистый</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">раствор и вода,</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ρф &gt; ρв</text><line x1="20.0" y1="466.0" x2="460.0" y2="466.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="496.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Глинистость: ГМ</text><text x="30.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">гамма-метод</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">все скважины,</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">любой раствор</text><rect x="20.0" y="576.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="601.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>