<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 586" width="480" height="586" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="586.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Поправки к Арчи</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Свойства глин</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что используют</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">объёмную долю</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинистой породы</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">и др.</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">электрические</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">свойства глин</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пласта</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Сколько таких методов</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">большинство</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">методов для</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинистых</text><text x="30.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">песчаников</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">немногие методы</text><line x1="20.0" y1="364.0" x2="460.0" y2="364.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="394.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Примеры и взгляд на воду</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">изменённые</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">уравнения Арчи</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Ваксмана–Смитса;</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">двух вод:</text><text x="258.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">связанная и</text><text x="258.0" y="506.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">своб.</text><rect x="20.0" y="530.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="555.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>