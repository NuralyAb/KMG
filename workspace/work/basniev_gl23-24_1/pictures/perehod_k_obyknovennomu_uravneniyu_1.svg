<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 696" width="480" height="696" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="696.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">∂P/∂t = κ ∂²P/∂x²</text><rect x="20.0" y="130.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="164.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">P зависит только от u = x/(2√(κt))</text><rect x="20.0" y="240.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="126.0" y="274.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">∂P/∂t =</text><text x="126.0" y="302.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">(dP/du)·(x/(2√-</text><text x="126.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">κ))·(−1/(2√(t³-</text><text x="126.0" y="358.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">)))</text><rect x="248.0" y="240.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="274.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">∂²P/∂x² =</text><text x="354.0" y="302.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">(1/(4κt))·d²P/-</text><text x="354.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">du²</text><rect x="20.0" y="434.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Подстановка обеих производных в</text><text x="240.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">уравнение</text><rect x="20.0" y="572.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="606.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">d²P/du² + 2u·dP/du = 0</text><line x1="240.0" y1="74.0" x2="240.0" y2="114.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,127.0 L231.0,114.4 L249.0,114.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="226.0" y="108.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">замена</text><line x1="126.0" y1="184.0" x2="126.0" y2="224.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,237.0 L117.0,224.4 L135.0,224.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="140.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">по t</text><line x1="354.0" y1="184.0" x2="354.0" y2="224.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,237.0 L345.0,224.4 L363.0,224.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="340.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">по x дважды</text><line x1="126.0" y1="378.0" x2="126.0" y2="418.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,431.0 L117.0,418.4 L135.0,418.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="378.0" x2="354.0" y2="418.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,431.0 L345.0,418.4 L363.0,418.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="516.0" x2="240.0" y2="556.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,569.0 L231.0,556.4 L249.0,556.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="640.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="665.0" fill="#FFFFF