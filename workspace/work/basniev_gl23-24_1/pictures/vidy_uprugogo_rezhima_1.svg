<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 614" width="480" height="614" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="614.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Упруговодонапор-</text><text x="30.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">ный</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Замкнуто-упругий</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Напор воды извне</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">тоже</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">поддерживает</text><text x="30.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">приток к забоям</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">залежь закрыта</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">со всех сторон</text><line x1="20.0" y1="234.0" x2="460.0" y2="234.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="264.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что вокруг залежи</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">есть область</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">питания, откуда</text><text x="30.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">идёт вода</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пласт</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">выклинивается</text><text x="258.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">или экранирован</text><text x="258.0" y="376.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сбросом</text><line x1="20.0" y1="392.0" x2="460.0" y2="392.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="422.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Когда имеет место</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">в некоторых</text><text x="30.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">случаях, при</text><text x="30.0" y="506.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">напоре воды</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">вначале, пока</text><text x="258.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">давление не</text><text x="258.0" y="506.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">упало до</text><text x="258.0" y="534.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">насыщения</text><rect x="20.0" y="558.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="583.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>