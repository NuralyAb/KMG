<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="640.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Пять параметров: r, t, κ, pк,</text><text x="240.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Q0μ/(2πkh)</text><rect x="20.0" y="158.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Независимые размерности у трёх: r,</text><text x="240.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">t, pк</text><rect x="20.0" y="296.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">P = p/pк = f(ξ, Q0μ/(2πkhpк))</text><rect x="20.0" y="406.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="440.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Одна переменная: ξ = r/(2√(κt))</text><rect x="20.0" y="516.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="550.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">d²P/dξ² + (1/ξ + 2ξ)·dP/dξ = 0</text><line x1="240.0" y1="102.0" x2="240.0" y2="142.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,155.0 L231.0,142.4 L249.0,142.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="240.0" x2="240.0" y2="280.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,293.0 L231.0,280.4 L249.0,280.4 Z" f