<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 588" width="480" height="588" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="588.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="126.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Главное: этапы</text><text x="126.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">плато, отмели и</text><text x="126.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">острова</text><rect x="248.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="354.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Под водой:</text><text x="354.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">смена</text><text x="354.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">рифостроителей</text><text x="354.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">и фаций</text><rect x="20.0" y="214.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="126.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Разные осадки;</text><text x="126.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">на острове —</text><text x="126.0" y="304.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">выщелачивание и</text><text x="126.0" y="332.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">карст пластами</text><rect x="248.0" y="214.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Биогермы</text><text x="354.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">чередуются с</text><text x="354.0" y="304.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">детритовыми и</text><text x="354.0" y="332.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">микрозернистыми</text><text x="354.0" y="360.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">пачками</text><rect x="20.0" y="436.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Слои с разными пустотами и</text><text x="240.0" y="498.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">коллекторскими свойствами</text><line x1="126.0" y1="158.0" x2="126.0" y2="198.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,211.0 L117.0,198.4 L135.0,198.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="158.0" x2="354.0" y2="198.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,211.0 L345.0,198.4 L363.0,198.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="126.0" y1="380.0" x2="126.0" y2="420.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,433.0 L117.0,420.4 L135.0,420.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="380.0" x2="354.0" y2="420.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,433.0 L345.0,420.4 L363.0,420.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="532.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="557.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>