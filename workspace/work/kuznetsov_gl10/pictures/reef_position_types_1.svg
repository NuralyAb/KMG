<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 632" width="480" height="632" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="632.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Одиночный риф</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Асимметр.</text><text x="258.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">система</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что это в плане и по положению</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">риф на локальном</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">поднятии дна</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">вытянутая</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">цепочка рифов</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Опора на дне</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">отмель над</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">складкой, бар,</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">вулкан и т. д.</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">крутой перегиб</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">морского дна</text><line x1="20.0" y1="336.0" x2="460.0" y2="336.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="366.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Обстановка</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">мелководная или</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глубоководная</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">граница</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">мелководья и</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глубоководья</text><line x1="20.0" y1="466.0" x2="460.0" y2="466.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="496.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Поперечное сечение</text><text x="30.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">примерно</text><text x="30.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">симметричное</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">асимметричное</text><rect x="20.0" y="576.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="601.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>