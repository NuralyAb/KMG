<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 532" width="480" height="532" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="532.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#2980B9" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Какова форма ловушки?</text><rect x="20.0" y="130.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="126.0" y="164.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Конус или</text><text x="126.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">подкова:</text><text x="126.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">многоствольная</text><text x="126.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">система</text><rect x="248.0" y="130.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#2980B9" stroke-width="2"/><text x="354.0" y="164.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Другие формы:</text><text x="354.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">что с вершиной</text><text x="354.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">и симметрией?</text><rect x="20.0" y="324.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="126.0" y="358.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Плоская вершина</text><text x="126.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">или атолл:</text><text x="126.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">кольцо по</text><text x="126.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">периферии</text><rect x="248.0" y="324.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="354.0" y="358.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Асимметричная с</text><text x="354.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">уплощённой</text><text x="354.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">вершиной:</text><text x="354.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">профили</text><line x1="126.0" y1="74.0" x2="126.0" y2="114.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,127.0 L117.0,114.4 L135.0,114.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="140.0" y="108.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">симм.</text><line x1="354.0" y1="74.0" x2="354.0" y2="114.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,127.0 L345.0,114.4 L363.0,114.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="340.0" y="108.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">другая</text><line x1="354.0" y1="268.0" x2="138.3" y2="318.1" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,321.0 L136.2,309.4 L140.3,326.9 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="140.0" y="302.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">симм.</text><line x1="354.0" y1="268.0" x2="354.0" y2="308.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,321.0 L345.0,308.4 L363.0,308.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="340.0" y="302.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">асимм.</text><rect x="20.0" y="476.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="501.0" fill="#FFFFFF" font-size="22"