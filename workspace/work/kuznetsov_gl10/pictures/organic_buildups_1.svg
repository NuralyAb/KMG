8.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при росте</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">возвышался над</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">дном</text><line x1="20.0" y1="410.0" x2="460.0" y2="410.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="440.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Уровень действия волн</text><text x="30.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">—</text><text x="258.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при росте не</text><text x="258.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">выходил выше</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">него</text><rect x="20.0" y="548.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="573.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>