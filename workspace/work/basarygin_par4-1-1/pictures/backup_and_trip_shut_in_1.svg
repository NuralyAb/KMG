<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 862" width="480" height="862" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="862.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Проявление при СПО: прекратить</text><text x="240.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">подъём или спуск</text><rect x="20.0" y="158.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Замок трубы над ротором, колонну</text><text x="240.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">подвесить на клиньях</text><rect x="20.0" y="296.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Установить открытый безопасный</text><text x="240.0" y="358.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">клапан</text><rect x="20.0" y="434.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Закрыть клапан и превентор с</text><text x="240.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">трубными плашками</text><rect x="20.0" y="572.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="606.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Приподнять квадрат над ротором,</text><text x="240.0" y="634.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">открыть клапан</text><rect x="20.0" y="710.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="744.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Регистрация давлений и притока</text><text x="240.0" y="772.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">раствора в амбар</text><line x1="240.0" y1="102.0" x2="240.0" y2="142.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,155.0 L231.0,142.4 L249.0,142.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="240.0" x2="240.0" y2="280.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,293.0 L231.0,280.4 L249.0,280.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="378.0" x2="240.0" y2="418.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,431.0 L231.0,418.4 L249.0,418.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="516.0" x2="240.0" y2="556.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,569.0 L231.0,556.4 L249.0,556.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="654.0" x2="240.0" y2="694.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,707.0 L231.0,694.4 L249.0,694.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="806.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="831.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>