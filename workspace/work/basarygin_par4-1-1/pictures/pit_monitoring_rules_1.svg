<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 670" width="480" height="670" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="670.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="126.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Изолировать</text><text x="126.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">рабочую ёмкость</text><text x="126.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">от других</text><rect x="248.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Уменьшить</text><text x="354.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">поверхность</text><text x="354.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">раствора</text><text x="354.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">перегородкой</text><rect x="20.0" y="214.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Задать исходный уровень после</text><text x="240.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">возобновления циркуляции</text><rect x="20.0" y="352.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="126.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Учесть добавки</text><text x="126.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">при обработке и</text><text x="126.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">утяжелении</text><text x="126.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">раствора</text><rect x="248.0" y="352.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="354.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Учесть сильные</text><text x="354.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">осадки, потери</text><text x="354.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">при очистке и</text><text x="354.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">испарении</text><rect x="20.0" y="546.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Своевременно заметить приток</text><line x1="126.0" y1="158.0" x2="126.0" y2="198.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,211.0 L117.0,198.4 L135.0,198.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="158.0" x2="354.0" y2="198.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,211.0 L345.0,198.4 L363.0,198.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="126.0" y1="296.0" x2="126.0" y2="336.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,349.0 L117.0,336.4 L135.0,336.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="296.0" x2="354.0" y2="336.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,349.0 L345.0,336.4 L363.0,336.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="126.0" y1="490.0" x2="126.0" y2="530.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,543.0 L117.0,530.4 L135.0,530.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1"