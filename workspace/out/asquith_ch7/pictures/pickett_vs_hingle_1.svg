<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 678" width="480" height="678" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="678.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Пикетт</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Хингл</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Sw без знания заранее</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">не нужны Rw, a,</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">m</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">не нужны Rw, ρma</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">или Δtma</text><line x1="20.0" y1="178.0" x2="460.0" y2="178.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="208.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что даёт водоносная линия</text><text x="30.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">m по наклону</text><text x="258.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ρma или Δtma по</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">отсечке</text><line x1="20.0" y1="280.0" x2="460.0" y2="280.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="310.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Где читают отсечку</text><text x="30.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при φ = 100 %:</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Rw (a известно</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">или оценено)</text><text x="258.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при нулевой</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">проводимости</text><line x1="20.0" y1="410.0" x2="460.0" y2="410.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="440.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что приходится принять</text><text x="30.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ρma и Δtma</text><text x="258.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">a и m</text><line x1="20.0" y1="484.0" x2="460.0" y2="484.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="514.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Построение вручную</text><text x="30.0" y="542.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">двойная</text><text x="30.0" y="570.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">логарифмическая</text><text x="30.0" y="598.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">бумага доступна</text><text x="258.0" y="542.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">особая бумага</text><text x="258.0" y="570.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">или расчёт</text><text x="258.0" y="598.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">параметра</text><rect x="20.0" y="622.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="647.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>