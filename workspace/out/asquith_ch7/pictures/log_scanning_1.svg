<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 948" width="480" height="948" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="948.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Терригенные</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Карбонатные</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что смотрят сначала</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Электрическое</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Пористость</text><line x1="20.0" y1="178.0" x2="460.0" y2="178.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="208.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Почему</text><text x="30.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Глины вокруг</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">дают почти</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">постоянный фон</text><text x="258.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Сопротивление</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сильно зависит</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">от породы</text><line x1="20.0" y1="308.0" x2="460.0" y2="308.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="338.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что проверяют потом</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">При высоком</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивлении —</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористость</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">При высокой</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористости —</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление</text><line x1="20.0" y1="438.0" x2="460.0" y2="438.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="468.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Водоносная опорная зона</text><text x="30.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Низкое</text><text x="30.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление</text><text x="258.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Высокая</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористость,</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">низкое</text><text x="258.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление</text><line x1="20.0" y1="596.0" x2="460.0" y2="596.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="626.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Плотная порода</text><text x="30.0" y="654.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Высокое</text><text x="30.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление,</text><text x="30.0" y="710.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">низкая</text><text x="30.0" y="738.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористость</text><text x="258.0" y="654.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Низкая</text><text x="258.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористость</text><line x1="20.0" y1="754.0" x2="460.0" y2="754.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="784.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Интересующий интервал</text><text x="30.0" y="812.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Высокие</text><text x="30.0" y="840.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление и</text><text x="30.0" y="868.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористость</text><text x="258.0" y="812.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Высокие</text><text x="258.0" y="840.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пористость и</text><text x="258.0" y="868.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление</text><rect x="20.0" y="892.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="917.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>