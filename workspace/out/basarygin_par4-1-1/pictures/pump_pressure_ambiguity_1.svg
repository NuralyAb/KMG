<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 688" width="480" height="688" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="688.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Давление растёт</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Давление падает</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Где наблюдают</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">в бурильных</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">трубах</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">на насосах</text><line x1="20.0" y1="178.0" x2="460.0" y2="178.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="208.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">С чем может быть связано</text><text x="30.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">высокие</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пластовое</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">давление и</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">продуктивность</text><text x="258.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">движение газовой</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пачки после</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">свабирования</text><line x1="20.0" y1="336.0" x2="460.0" y2="336.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="366.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Механизм</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">меняется забой,</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">растёт</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сопротивление</text><text x="30.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">затрубья</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пачка поступила</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при подъёме</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">колонны</text><line x1="20.0" y1="494.0" x2="460.0" y2="494.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="524.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Об интенсивности</text><text x="30.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">начальный рост</text><text x="30.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">на стояке связан</text><text x="30.0" y="608.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">с ней</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">одно падение не</text><text x="258.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">значит, что</text><text x="258.0" y="608.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">приток слабый</text><rect x="20.0" y="632.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="657.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>