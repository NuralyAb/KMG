<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 818" width="480" height="818" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="818.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Прочие признаки</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Бывают и без</text><text x="258.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">него</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Объём и скорость</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Растёт объём</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">раствора в</text><text x="30.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ёмкостях</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Растёт</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">механическая</text><text x="258.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">скорость бурения</text><line x1="20.0" y1="234.0" x2="460.0" y2="234.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="264.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Поток и свойства</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Растёт расход на</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">выходе при той</text><text x="30.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">же подаче</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Меняются</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">свойства</text><text x="258.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">бурового</text><text x="258.0" y="376.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">раствора</text><line x1="20.0" y1="392.0" x2="460.0" y2="392.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="422.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Газ и давление</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Растёт</text><text x="30.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">газосодержание</text><text x="30.0" y="506.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">раствора</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Меняется</text><text x="258.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">давление на</text><text x="258.0" y="506.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">буровых насосах</text><line x1="20.0" y1="522.0" x2="460.0" y2="522.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="552.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Подъём колонны</text><text x="30.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Долив меньше</text><text x="30.0" y="608.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">расчётного</text><text x="258.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">—</text><line x1="20.0" y1="624.0" x2="460.0" y2="624.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="654.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Спуск колонны</text><text x="30.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Объём в приёмной</text><text x="30.0" y="710.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ёмкости выше</text><text x="30.0" y="738.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">расчётного</text><text x="258.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="20.0" y="762.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="787.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>