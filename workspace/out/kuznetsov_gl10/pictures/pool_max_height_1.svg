<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 790" width="480" height="790" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="790.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Условие</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Предел высоты</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Одиночный риф, рельеф</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">комплекс</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">перекрыт</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">покрышкой</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">может равняться</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">превышению над</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">внерифовыми</text><line x1="20.0" y1="206.0" x2="460.0" y2="206.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="236.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Боковое экранирование</text><text x="30.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непроницаемые</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">внерифовые</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">породы</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">практически до</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">полной мощности</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">рифа</text><line x1="20.0" y1="336.0" x2="460.0" y2="336.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="366.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Краевой асимм., без тектоники</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">зарифовые обычно</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">не флюидоупор</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">как правило, не</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">выше превышения</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">над ними</text><line x1="20.0" y1="466.0" x2="460.0" y2="466.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="496.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Асимметричный барьерный риф</text><text x="30.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">за рифом часто</text><text x="30.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непроницаемые</text><text x="30.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">лагунные</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">возможна висячая</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">залежь, весьма</text><text x="258.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">высокая</text><line x1="20.0" y1="596.0" x2="460.0" y2="596.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="626.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Тектоника после рифа</text><text x="30.0" y="654.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">позже возникла</text><text x="30.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">структура</text><text x="258.0" y="654.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">амплитуда и</text><text x="258.0" y="682.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">высота растут во</text><text x="258.0" y="710.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">всех случаях</text><rect x="20.0" y="734.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="759.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>