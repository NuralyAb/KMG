<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" width="480" height="450" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="450.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="126.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Коллекторы</text><text x="126.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">связаны с</text><text x="126.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">фациальной</text><text x="126.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">зональностью</text><rect x="248.0" y="20.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="354.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Шуртан:</text><text x="354.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">биогермный</text><text x="354.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">гребень</text><text x="354.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">смещался во</text><text x="354.0" y="166.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">времени</text><rect x="20.0" y="242.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="126.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">В асимметричном</text><text x="126.0" y="304.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">рифе коллекторы</text><text x="126.0" y="332.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">асимметричны</text><rect x="248.0" y="242.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="354.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Смещались и</text><text x="354.0" y="304.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">зоны улучшенных</text><text x="354.0" y="332.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">коллекторских</text><text x="354.0" y="360.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">свойств</text><line x1="126.0" y1="186.0" x2="126.0" y2="226.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,239.0 L117.0,226.4 L135.0,226.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="186.0" x2="354.0" y2="226.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,239.0 L345.0,226.4 L363.0,226.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="394.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="419.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>