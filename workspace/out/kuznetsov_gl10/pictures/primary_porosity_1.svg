<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 726" width="480" height="726" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="726.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="126.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Полости</text><text x="126.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">скелетов,</text><text x="126.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">промежутки в</text><text x="126.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">каркасе, щели</text><rect x="248.0" y="20.0" width="212.0" height="136.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="354.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Межзерновые</text><text x="354.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">поры и</text><text x="354.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">пещеровидные</text><text x="354.0" y="138.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">пустоты</text><rect x="20.0" y="214.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="248.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Разнообразная первичная пористость</text><text x="240.0" y="276.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">рифа</text><rect x="20.0" y="352.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="126.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Инкрустирующие</text><text x="126.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">водоросли,</text><text x="126.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">подводная</text><text x="126.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">цементация</text><rect x="248.0" y="352.0" width="212.0" height="164.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="386.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Мелкие</text><text x="354.0" y="414.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">организмы и</text><text x="354.0" y="442.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">детрит,</text><text x="354.0" y="470.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">выпадение</text><text x="354.0" y="498.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">карбонатов</text><rect x="20.0" y="574.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="608.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">В полном объёме и чистом виде</text><text x="240.0" y="636.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">практически не сохраняется</text><line x1="126.0" y1="158.0" x2="126.0" y2="198.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,211.0 L117.0,198.4 L135.0,198.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="158.0" x2="354.0" y2="198.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,211.0 L345.0,198.4 L363.0,198.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="126.0" y1="296.0" x2="126.0" y2="336.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,349.0 L117.0,336.4 L135.0,336.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="140.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">при росте</text><line x1="354.0" y1="296.0" x2="354.0" y2="336.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,349.0 L345.0,336.4 L363.0,336.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="126.0" y1="518.0" x2="126.0" y2="558.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,571.0 L117.0,558.4 L135.0,558.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="518.0" x2="354.0" y2="558.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,571.0 L345.0,558.4 L363.0,558.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="670.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="695.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>