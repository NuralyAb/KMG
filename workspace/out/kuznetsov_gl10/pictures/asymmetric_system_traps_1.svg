<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 688" width="480" height="688" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="688.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Только рельеф</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">Есть боковой</text><text x="258.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">экран</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Тип ловушки</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">палеогеоморфоло-</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">гическая</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">литолого-палеог-</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">еоморфологическ-</text><text x="258.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ая</text><line x1="20.0" y1="234.0" x2="460.0" y2="234.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="264.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Что создаёт ловушку</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">древний рельеф</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">рифа под</text><text x="30.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">покрышкой</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">рельеф рифа и</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">дополнительный</text><text x="258.0" y="348.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">экран</text><line x1="20.0" y1="364.0" x2="460.0" y2="364.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="394.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Зарифовые отложения</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">риф мало</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">возвышается над</text><text x="30.0" y="478.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ними</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непроницаемы и</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">служат экраном</text><line x1="20.0" y1="494.0" x2="460.0" y2="494.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="524.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Высота ловушки</text><text x="30.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">обычно не очень</text><text x="30.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">значительна</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">может</text><text x="258.0" y="580.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">увеличиться, как</text><text x="258.0" y="608.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">и объём</text><rect x="20.0" y="632.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="657.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>