<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 632" width="480" height="632" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="632.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">По сходству</text><text x="30.0" y="75.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">пород</text><rect x="248.0" y="20.0" width="212.0" height="70.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">По времени</text><line x1="20.0" y1="104.0" x2="460.0" y2="104.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="134.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Как выглядят песчаники</text><text x="30.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">непрерывные,</text><text x="30.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">протянуты через</text><text x="30.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">обе скважины</text><text x="258.0" y="162.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">разобщены</text><text x="258.0" y="190.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">гетеролитами и</text><text x="258.0" y="218.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глинами</text><line x1="20.0" y1="234.0" x2="460.0" y2="234.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="264.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Форма тел</text><text x="30.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">субгоризонтальн-</text><text x="30.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ые песчаные тела</text><text x="258.0" y="292.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">наклонены в</text><text x="258.0" y="320.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сторону бассейна</text><line x1="20.0" y1="336.0" x2="460.0" y2="336.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="366.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Вниз по наклону</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">тонкие глинистые</text><text x="30.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">прослои между</text><text x="30.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">песками</text><text x="258.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">песчаник →</text><text x="258.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">гетеролиты →</text><text x="258.0" y="450.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">глины</text><line x1="20.0" y1="466.0" x2="460.0" y2="466.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="496.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Связь скважин 1 и 2 по пескам</text><text x="30.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">кажется, что</text><text x="30.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пески едины</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">гидродинамическ-</text><text x="258.0" y="552.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">ой связности нет</text><rect x="20.0" y="576.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="601.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>