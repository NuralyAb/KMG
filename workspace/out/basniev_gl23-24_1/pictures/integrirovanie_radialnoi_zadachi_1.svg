<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 916" width="480" height="916" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="916.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Замена v = dP/dξ: уравнение</text><text x="240.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">первого порядка</text><rect x="20.0" y="158.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Разделить переменные и</text><text x="240.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">проинтегрировать</text><rect x="20.0" y="296.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">v = C1·exp(−ξ²)/ξ</text><rect x="20.0" y="406.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="440.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Интеграл от ξ до ∞, где P = 1</text><rect x="20.0" y="516.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="550.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Условие дебита при ξ → 0: C1 =</text><text x="240.0" y="578.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Q0μ/(2πkhpк)</text><rect x="20.0" y="654.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="688.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Замена u = ξ² и возврат к p = P·pк</text><rect x="20.0" y="764.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="798.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">p = pк − Q0μ/(4πkh) · ∫ exp(−u)/u</text><text x="240.0" y="826.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">du</text><line x1="240.0" y1="102.0" x2="240.0" y2="142.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,155.0 L231.0,142.4 L249.0,142.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="240.0" x2="240.0" y2="280.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,293.0 L231.0,280.4 L249.0,280.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><text x="226.0" y="274.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="end">потенцируем</text><line x1="240.0" y1="350.0" x2="240.0" y2="390.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,403.0 L231.0,390.4 L249.0,390.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="460.0" x2="240.0" y2="500.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,513.0 L231.0,500.4 L249.0,500.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="598.0" x2="240.0" y2="638.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,651.0 L231.0,638.4 L249.0,638.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="708.0" x2="240.0" y2="748.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,761.0 L231.0,748.4 L249.0,748.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="860.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="885.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>