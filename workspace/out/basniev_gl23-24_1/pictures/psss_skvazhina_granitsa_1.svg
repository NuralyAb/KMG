<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 498" width="480" height="498" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="498.0" rx="12" fill="#0F1419" stroke="none" /><text x="20.0" y="40.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">радиус возмущённой области R(t)</text><line x1="40.0" y1="356.0" x2="40.0" y2="61.8" stroke="#8A96A3" stroke-width="2"/><path d="M40.0,52.0 L47.0,61.8 L33.0,61.8 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="40.0" y1="356.0" x2="456.2" y2="356.0" stroke="#8A96A3" stroke-width="2"/><path d="M466.0,356.0 L456.2,363.0 L456.2,349.0 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><path d="M40.0,326.0 L61.0,290.0 L82.0,266.0 L124.0,233.0 L208.0,185.0 L292.0,146.0 L376.0,113.0 L460.0,86.0" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linejoin="round" /><circle cx="40.0" cy="326.0" r="7" fill="#ECEFF4"/><text x="52.0" y="314.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">t = 0: R = rс</text><text x="460.0" y="384.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="end">время после пуска t →</text><rect x="20.0" y="404.0" width="22.0" height="22.0" rx="4" fill="#F1C40F" stroke="#ECEFF4" /><text x="54.0" y="422.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">R(t) = √(rс² + 4κt)</text><rect x="20.0" y="442.0" width="150.0" height="34.0" rx="6" fill="#2980B9" stroke="none" /><text x="95.0" y="467.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">симуляция</text></svg>