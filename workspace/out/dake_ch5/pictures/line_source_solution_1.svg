<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 586" width="480" height="586" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="586.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="108.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="126.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Выражение для</text><text x="126.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">производной: p'</text><text x="126.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">= C₂·e^(−s)/s</text><rect x="248.0" y="20.0" width="212.0" height="108.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="354.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">У скважины: r</text><text x="354.0" y="82.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">∂p/∂r → qμ/2πkh</text><text x="354.0" y="110.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">при r → 0</text><rect x="20.0" y="186.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">r → 0, значит s → 0: C₂ = qμ/4πkh</text><rect x="20.0" y="296.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Интегрируем: s от ∞ до x, давление</text><text x="240.0" y="358.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">от начального до p</text><rect x="20.0" y="434.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Давление p в любой точке r в любой</text><text x="240.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">момент t</text><line x1="126.0" y1="130.0" x2="126.0" y2="170.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,183.0 L117.0,170.4 L135.0,170.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="130.0" x2="354.0" y2="170.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,183.0 L345.0,170.4 L363.0,170.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="240.0" x2="240.0" y2="280.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,293.0 L231.0,280.4 L249.0,280.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="378.0" x2="240.0" y2="418.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,431.0 L231.0,418.4 L249.0,418.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="530.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="555.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>