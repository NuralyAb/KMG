<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 724" width="480" height="724" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="724.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="440.0" height="52.0" rx="8" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="240.0" y="54.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Уравнение (5.18), пласт однородный</text><rect x="20.0" y="130.0" width="212.0" height="108.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="126.0" y="164.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Вязкость μ</text><text x="126.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">постоянна</text><rect x="248.0" y="130.0" width="212.0" height="108.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="354.0" y="164.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Градиент ∂p/∂r</text><text x="354.0" y="192.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">мал, (∂p/∂r)²</text><text x="354.0" y="220.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">отбрасывают</text><rect x="20.0" y="296.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="330.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">(5.19), или (5.20): два первых</text><text x="240.0" y="358.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">слагаемых убраны</text><rect x="20.0" y="434.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="240.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Сжимаемость c постоянна, значит</text><text x="240.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">φμc/k постоянен</text><rect x="20.0" y="572.0" width="440.0" height="80.0" rx="8" fill="#1A2129" stroke="#27AE60" stroke-width="2"/><text x="240.0" y="606.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">Уравнение линеаризовано; годится</text><text x="240.0" y="634.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="middle">лишь при cp ≪ 1</text><line x1="126.0" y1="74.0" x2="126.0" y2="114.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,127.0 L117.0,114.4 L135.0,114.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="74.0" x2="354.0" y2="114.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,127.0 L345.0,114.4 L363.0,114.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="126.0" y1="240.0" x2="126.0" y2="280.4" stroke="#8A96A3" stroke-width="3"/><path d="M126.0,293.0 L117.0,280.4 L135.0,280.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="354.0" y1="240.0" x2="354.0" y2="280.4" stroke="#8A96A3" stroke-width="3"/><path d="M354.0,293.0 L345.0,280.4 L363.0,280.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="378.0" x2="240.0" y2="418.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,431.0 L231.0,418.4 L249.0,418.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><line x1="240.0" y1="516.0" x2="240.0" y2="556.4" stroke="#8A96A3" stroke-width="3"/><path d="M240.0,569.0 L231.0,556.4 L249.0,556.4 Z" fill="#8A96A3" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" /><rect x="20.0" y="668.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="693.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>