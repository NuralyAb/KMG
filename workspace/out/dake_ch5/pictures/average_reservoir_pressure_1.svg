<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 604" width="480" height="604" font-family="Segoe UI, sans-serif" role="img"><rect x="0.0" y="0.0" width="480.0" height="604.0" rx="12" fill="#0F1419" stroke="none" /><rect x="20.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="30.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">По объёмам</text><rect x="248.0" y="20.0" width="212.0" height="42.0" rx="8" fill="#1A2129" stroke="none" /><text x="258.0" y="47.0" fill="#ECEFF4" font-size="22" font-weight="600" text-anchor="start">По дебитам</text><line x1="20.0" y1="76.0" x2="460.0" y2="76.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="106.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Формула среднего давления</text><text x="30.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Σp̄ᵢVᵢ / ΣVᵢ</text><text x="258.0" y="134.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Σp̄ᵢqᵢ / Σqᵢ</text><line x1="20.0" y1="150.0" x2="460.0" y2="150.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="180.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Вес каждой зоны</text><text x="30.0" y="208.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">объём зоны Vᵢ</text><text x="258.0" y="208.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">дебит qᵢ,</text><text x="258.0" y="236.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">пропорциональный</text><text x="258.0" y="264.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">Vᵢ</text><line x1="20.0" y1="280.0" x2="460.0" y2="280.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="310.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Получить вес на практике</text><text x="30.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">объёмы</text><text x="30.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">определить</text><text x="30.0" y="394.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">трудно</text><text x="258.0" y="338.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">дебиты регулярно</text><text x="258.0" y="366.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">измеряют</text><line x1="20.0" y1="410.0" x2="460.0" y2="410.0" stroke="#1A2129" stroke-width="2"/><text x="30.0" y="440.0" fill="#8A96A3" font-size="22" font-weight="400" text-anchor="start">Условия замены весов</text><text x="30.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">исходное</text><text x="30.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">взвешивание</text><text x="258.0" y="468.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">dp/dt постоянен,</text><text x="258.0" y="496.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">сжимаемость</text><text x="258.0" y="524.0" fill="#ECEFF4" font-size="22" font-weight="400" text-anchor="start">меняется мало</text><rect x="20.0" y="548.0" width="94.0" height="34.0" rx="6" fill="#8E44AD" stroke="none" /><text x="67.0" y="573.0" fill="#FFFFFF" font-size="22" font-weight="400" text-anchor="middle">схема</text></svg>