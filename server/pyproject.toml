[project]
name = "glava-server"
version = "0.1.0"
description = "Локальный сервер приложения «Глава → курс»"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "httpx>=0.27"]

[project.scripts]
glava-server = "glava_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glava_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["glava_server"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
