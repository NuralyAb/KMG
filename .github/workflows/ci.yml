name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Секретов нет, модель не вызывается, артефакты и кэш не выгружаются.
# Выгрузка частичная: слои, курсы и листы опечаток с цитатами книг на исполнителя не попадают, тестам они не нужны.

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/workspace/work/
            !/workspace/out/
            !/workspace/domain/*/errata/
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.7"
          enable-cache: false
      # У pycairo нет готовой сборки под Linux, а produce.py и render.py импортируют cairo при загрузке.
      - name: Библиотека cairo
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libcairo2-dev pkg-config
      - name: Тесты конвейера, сервера и границ модулей
        run: uv run --locked --python 3.12 --with pycairo==1.29.2 pytest -q --tb=short

  course-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /backend/glava/modules/course/assets/
            /backend/glava/modules/lab/assets/
            /backend/tests/lab_ui/
            /workspace/domain/geology/practice/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Синтаксис
        run: |
          set -e
          for file in backend/glava/modules/course/assets/*.js; do node --check "$file"; done
      - name: Тесты лаборатории
        run: node --test backend/tests/lab_ui/*.test.js

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/workspace/work/
            !/workspace/out/
            !/workspace/domain/*/errata/
      # Пока нет web/package-lock.json, шаги пропускаются и задание проходит.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('web/package-lock.json') != ''
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Зависимости
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Типы
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm run typecheck
      - name: Тесты
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm test
      - name: Сборка
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: npm run build
      - name: Плеер курса собран из текущего кода
        if: hashFiles('web/package-lock.json') != ''
        working-directory: web
        run: |
          npm run build:course
          git diff --exit-code -- ../backend/glava/modules/course/assets/course.js
