<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-тренажёры</title>
<style>
:root{--bg:#0F1419;--panel:#1A2129;--line:#2b3540;--text:#ECEFF4;--mut:#9aa6b3}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100dvh;display:grid;grid-template:56px minmax(0,1fr)/minmax(0,1fr) 420px}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
select,button,textarea{font:inherit;color:inherit}
#scene{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;max-width:300px;min-width:0}
#sub{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
header button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
header button:hover{border-color:var(--mut)}
#view{position:relative;overflow:hidden;min-width:0;min-height:0;background:#9fb2c2}
#view canvas{display:block;position:absolute;inset:0;touch-action:none}.labels{position:absolute!important;inset:0;pointer-events:none}
.badge{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;z-index:3;pointer-events:none}
.badge span{background:rgba(15,20,25,.82);border-radius:6px;padding:4px 10px;font-size:14px}.badge #prov{background:#2980B9}
.lbl{background:rgba(15,20,25,.82);padding:3px 9px;border-radius:6px;font-size:14px;line-height:1.3;white-space:nowrap;text-align:center}
.lbl.soft{background:rgba(15,20,25,.6);font-size:13px}.lbl.num{pointer-events:auto;cursor:pointer;font-weight:700;background:var(--text);color:var(--bg);border-radius:50%;width:28px;height:28px;padding:0;line-height:28px;font-size:15px}
#panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px;min-height:0}
section{margin-bottom:24px}h2{font-size:20px;line-height:1.25;margin:0 0 8px;text-wrap:balance}h3{font-size:16px;margin:14px 0 6px}p{margin:0 0 10px}ul{margin:0 0 10px;padding-left:20px}
.mut{color:var(--mut)}.pg{color:var(--mut);white-space:nowrap}
.opts{display:grid;gap:8px}.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--mut)}.opt:disabled{opacity:.6;cursor:default}.opt.sel,.opt.ok,.opt.no{opacity:1;border-color:var(--text)}.opt.ok::after{content:"  ✓ верно"}.opt.no::after{content:"  ✕ ваш ответ"}
.why{background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:10px}
.main{width:100%;background:var(--text);color:var(--bg);border:0;border-radius:8px;padding:12px;font-weight:600;cursor:pointer;margin:8px 0 20px}.main:disabled{opacity:.35;cursor:default}.main.alt{background:none;color:var(--text);border:1px solid var(--text);margin-bottom:8px}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
#panel canvas{width:100%;display:block;border-radius:8px}.log{cursor:ns-resize;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}.chip.on{background:var(--text);color:var(--bg)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.kv div{background:var(--bg);border-radius:8px;padding:8px 10px}.kv span{display:block;color:var(--mut);font-size:14px}.kv b{font-variant-numeric:tabular-nums}
.pn b{font-size:20px}.res{border-left:5px solid;padding:4px 0 4px 12px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.score div{background:var(--bg);border-radius:8px;padding:12px}.score b{display:block;font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}.score span{color:var(--mut);font-size:14px;line-height:1.3;display:block}
.sl{display:block;margin:10px 0}.sl>span{display:flex;justify-content:space-between;gap:10px}.sl b{font-variant-numeric:tabular-nums;white-space:nowrap}.sl input{width:100%;accent-color:#ECEFF4;height:32px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:8px}.leg i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.hon{border-top:1px solid var(--line);padding-top:12px}.hon summary{cursor:pointer;font-weight:600}
[hidden]{display:none!important}
.embed header,.embed #home{display:none!important}
.embed #app{grid-template:minmax(0,1fr)/minmax(0,1fr) clamp(320px,34%,420px)}.embed #panel{padding:16px}
#hint{position:absolute;z-index:3;top:16px;left:16px;right:16px;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:12px;background:rgba(15,20,25,.9);border-radius:10px;padding:10px 16px;pointer-events:none}
#hint b{white-space:nowrap;color:var(--mut);font-weight:600;font-size:14px}#hint span{font-weight:600;line-height:1.3}#hint i{display:flex;gap:4px}#hint u{width:14px;height:5px;border-radius:3px;background:#3a4550}#hint u.was{background:#8A96A3}#hint u.now{background:#ECEFF4}
#home{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}#home .in{max-width:1120px;margin:0 auto;padding:48px 24px}
h1{font-size:34px;line-height:1.15;margin:0 0 8px}#home p{color:var(--mut);margin-bottom:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px}
.card{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;padding-bottom:16px}.card:hover{border-color:var(--mut)}
.card img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;margin-bottom:14px}.card b{font-size:19px;line-height:1.25}.card b,.card span,.card small{padding:0 16px}.card span{margin:6px 0 10px}.card small{color:var(--mut);font-size:14px;margin-top:auto}
dialog{width:min(760px,94vw);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px}dialog::backdrop{background:rgba(0,0,0,.6)}
#json{width:100%;height:52vh;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:14px/1.45 Consolas,monospace;resize:vertical}.bad{background:#3b1f1f;border-radius:8px;padding:10px}
.row{display:flex;gap:10px}.row .main{margin:10px 0 0}.fail{padding:40px}
@media(max-width:800px){#app{grid-template:auto 46dvh minmax(0,1fr)/minmax(0,1fr)}header{grid-column:1;flex-wrap:wrap;gap:8px;padding:8px 12px}#sub{display:none}#scene{flex:1 1 100%;max-width:none;order:-1}header button{padding:6px 6px;font-size:15px}#hint{top:8px;padding:8px 12px;gap:8px;left:8px;right:8px;width:auto}#hint i{display:none}#hint span{font-size:15px}#home .in{padding:28px 16px}header button{flex:1}#panel{border:0;border-top:1px solid var(--line);padding:16px}.lbl{font-size:12px}.badge{left:8px;bottom:8px}}
/* внутри страницы узкое место: сцена сверху, задание под ней */
@media(max-width:800px){.embed #app{grid-template:minmax(220px,48dvh) minmax(0,1fr)/minmax(0,1fr)}}
</style></head><body class="embed"><div id="app">
<header><button id="all">Все тренажёры</button><select id="scene" aria-label="Тренажёр"></select><span id="sub"></span><button id="next">Новый случай</button><button id="edit">Спецификация</button></header>
<div id="view"><div id="hint" role="status" hidden></div><div class="badge"><span id="prov"></span><span id="case"></span></div></div>
<main id="panel" tabindex="-1"></main></div>
<div id="home"><div class="in"><h1>Тренажёры по геологии</h1><p>Ситуации, в которых надо принять решение. Выберите любую.</p><div class="cards"></div></div></div>
<dialog id="spec"><h2>Спецификация сцены</h2><p class="mut">Вся сцена — этот JSON. Поменяйте число и пересоберите. Нарушите физику — движок откажется.</p><textarea id="json" spellcheck="false"></textarea><p id="msg"></p><div class="row"><button class="main" id="apply">Проверить и собрать</button><button class="main alt" id="close">Закрыть</button></div></dialog>
<script src="textures.js"></script>
<script src="sky.js"></script>
<script src="../../simulations.js"></script>
<script src="player.js"></script></body></html>
